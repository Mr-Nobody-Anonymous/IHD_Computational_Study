name: solutions-tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check src tests run_solutions.py
          ruff format --check src/ihd_solutions tests run_solutions.py
      - name: Validate registries
        run: python run_solutions.py validate
      - name: Test with coverage
        run: pytest --cov=ihd_solutions --cov-report=term-missing --cov-fail-under=95
      - name: Regenerate artefacts and verify the manifest
        run: |
          python run_solutions.py simulate
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("results/solutions")
          manifest = json.loads((root / "run_manifest.json").read_text())
          assert manifest["status"] == "passed"
          for entry in manifest["outputs"]:
              payload = (root / entry["path"]).read_bytes()
              assert len(payload) == entry["bytes"], entry["path"]
              assert hashlib.sha256(payload).hexdigest() == entry["sha256"], entry["path"]
          print(f"verified {len(manifest['outputs'])} artefacts")
          PY
